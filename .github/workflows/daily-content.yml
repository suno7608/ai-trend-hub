name: Daily Content Pipeline

on:
  schedule:
    # 03:17 UTC = 12:17 KST.
    # Moved earlier from 06:00 UTC (15:00 KST) and off the top of the hour.
    # GitHub queues scheduled workflows hardest at minute 0, and this workflow
    # has been starting 6-9 hours late. A 9 hour delay from 15:00 KST lands on
    # 00:00 KST the next day, which used to stamp that day's newsletter as
    # already sent. The same 9 hour delay from 12:17 KST starts around 21:17 KST,
    # so the run still belongs to the same KST date (the job itself is about
    # 20 minutes). Crossing midnight now takes a delay of about 11.5 hours.
    # Weekly (Sunday 05:00 UTC) and monthly (1st 05:00 UTC) schedules are unchanged.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Maximum articles to fetch'
        required: false
        default: '15'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-pipeline"
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: "Step 1: Collect RSS feeds"
        id: collect
        timeout-minutes: 6
        run: node scripts/collect.js --max-items=${{ github.event.inputs.max_items || '15' }}

      - name: "Step 2: Summarize with Claude AI"
        timeout-minutes: 10
        run: |
          if [ ! -s data/collected_raw.json ] || [ "$(cat data/collected_raw.json)" = "[]" ]; then
            echo "⚠️ No articles collected. Skipping summarization."
            exit 0
          fi
          node scripts/summarize.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}

      - name: "Step 3: Generate markdown files"
        run: |
          if [ ! -s data/collected_raw.json ] || [ "$(cat data/collected_raw.json)" = "[]" ]; then
            echo "⚠️ Skipping — no articles."
            exit 0
          fi
          node scripts/generate.js

      - name: "Step 4: Validate schema"
        id: validate
        run: node scripts/validate.js || true

      - name: "Step 5: Build site"
        run: node scripts/build.js

      - name: "Step 6: Commit and push"
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "AI Trend Hub Bot"
          # newsletter_state.json MUST be committed so the next run can see which
          # article URLs were already emailed and skip a true duplicate send.
          git add content/ data/processed_urls.json data/archive/ data/summarized.json data/newsletter_state.json
          git diff --staged --quiet || git commit -m "📰 Daily content update $(date +%Y-%m-%d)"
          git push || echo "Nothing to push"

      - name: "Step 7: Upload to GitHub Pages"
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: "Step 8: Setup Python for newsletter"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Step 9: Send KR and EN newsletters"
        id: newsletter
        run: |
          if [ ! -s data/summarized.json ] || [ "$(cat data/summarized.json)" = "[]" ]; then
            echo "⚠️ No summarized articles. Skipping newsletter."
            echo "summary=Daily pipeline completed. KO newsletter was skipped (no articles). EN newsletter was skipped (no articles)." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pip install google-auth google-auth-oauthlib google-api-python-client
          # Write Google token from secret
          echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > /tmp/google-token.json
          python3 scripts/newsletter_sender.py --language ko --send --force | tee /tmp/newsletter-ko.log
          python3 scripts/newsletter_sender.py --language en --send --force | tee /tmp/newsletter-en.log
          ko_line=$(grep '^NEWSLETTER_RESULT ' /tmp/newsletter-ko.log | tail -n 1 || true)
          en_line=$(grep '^NEWSLETTER_RESULT ' /tmp/newsletter-en.log | tail -n 1 || true)
          summary=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); from newsletter_sender import summarize_run_status; print(summarize_run_status(sys.argv[1], sys.argv[2]))' "$ko_line" "$en_line")
          echo "summary=${summary}" >> "$GITHUB_OUTPUT"
        env:
          GOOGLE_TOKEN_PATH: /tmp/google-token.json

      - name: "Step 10: Commit newsletter state"
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "AI Trend Hub Bot"
          git add data/newsletter_state.json
          git diff --staged --quiet || git commit -m "📌 Newsletter state update $(date +%Y-%m-%d)" && git push || echo "Nothing to commit"

      - name: "Notify: Success"
        if: success()
        run: node scripts/notify-telegram.js --status=success --pipeline=daily --details="${{ steps.newsletter.outputs.summary || 'Daily pipeline completed. Newsletter status unknown.' }}" --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: "Notify: Failure"
        if: failure()
        run: |
          npm ci 2>/dev/null || true
          node scripts/notify-telegram.js --status=failure --pipeline=daily --details="Pipeline failed at step" --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: pipeline
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: ./.github/actions/deploy-pages-resilient
